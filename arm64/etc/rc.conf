# /etc/rc.conf: which services Ulix starts (the same idea as rc.conf of the BSDs).
# A line is  name="YES"  or  name="NO"; a setting that is missing has its default.

# the telnet server (port 23, a login on terminal 5); default: YES
telnetd_enable="YES"

# the network log: the link of the card and the DHCP messages are appended to /var/log/net.log; default: NO
netlog_enable="NO"
